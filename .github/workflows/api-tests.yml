name: API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run API tests with Newman
        run: >
          npx newman run "api-tests/E-Commerce API Tests.postman_collection.json"
          -e "api-tests/DummyJSON - QA.postman_environment.json"
          --env-var "base_url=https://dummyjson.com"
          --env-var "product_id=1"
          --env-var "user_id=1"
          --env-var "cart_id=1"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
        python-version: "3.14"

      - name: Install Python dependencies
        run: pip install -r python-api-tests/requirements.txt

      - name: Run Python API tests
        working-directory: python-api-tests
        run: pytest